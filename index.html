<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
        html, body { height: 100vh; height: 100dvh; background: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; top: 0; left: 0; }

        .ios-container { width: 100%; max-width: 428px; height: 100vh; height: 100dvh; background: #000000; display: flex; flex-direction: column; justify-content: flex-start; padding: 32px 20px; overflow: hidden; }
        @media (min-width: 500px) { .ios-container { height: 884px; border-radius: 48px; border: 12px solid #1c1c1e; box-shadow: 0 25px 60px rgba(0,0,0,0.9); } }

        .ios-content { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; margin-top: 40px; }
        .ios-icon-badge { width: 76px; height: 76px; background: rgba(255, 255, 255, 0.06); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 4px; backdrop-filter: blur(20px); border: 0.5px solid rgba(212, 175, 55, 0.3); }
        
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: #ffffff; }
        p { font-size: 14.5px; color: #8e8e93; line-height: 1.4; max-width: 320px; }

        /* Buttons shifted up close to text without awkward bottom gaps */
        .ios-btn-group { display: flex; flex-direction: column; gap: 14px; width: 100%; margin-top: 36px; }
        
        .ios-btn { width: 100%; background: linear-gradient(135deg, #1c1c1e, #111113); color: #ffffff; border: 0.5px solid rgba(212, 175, 55, 0.4); padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .ios-btn-primary { background: linear-gradient(135deg, #d4af37, #aa820a); color: #000000; border: none; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3); }
        .ios-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-content">
        <div class="ios-icon-badge">✨</div>
        <h1>Welcome Portal</h1>
        <p>Explore our exclusive connections or join our official community channel instantly.</p>
    </div>

    <div class="ios-btn-group">
        <a href="https://whatsapp.com/channel/0029VbDTCV73bbVB47MSzT03" target="_blank" class="ios-btn">Join Channel</a>
        <a href="connections.html" class="ios-btn ios-btn-primary">View All Connections</a>
    </div>
</div>

</body>
</html>
