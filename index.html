<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
        html, body { height: 100vh; height: 100dvh; background: #e8e2d9; color: #1c1b1a; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; top: 0; left: 0; }

        .ios-container { width: 100%; max-width: 428px; height: 100vh; height: 100dvh; background: #e8e2d9; display: flex; flex-direction: column; justify-content: center; padding: 28px 24px; overflow: hidden; }
        @media (min-width: 500px) { .ios-container { height: 884px; border-radius: 48px; border: 12px solid #2c2a29; box-shadow: 0 25px 60px rgba(0,0,0,0.2); } }

        .ios-content { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
        
        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #1c1b1a; }
        p { font-size: 16px; color: #3a3836; line-height: 1.5; font-weight: 500; }

        .ios-btn-group { display: flex; flex-direction: column; gap: 14px; width: 100%; margin-top: 32px; }
        
        .ios-btn { width: 100%; background: #1c1b1a; color: #f5f2ed; border: none; padding: 17px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, opacity 0.2s; }
        .ios-btn-secondary { background: #d6cec2; color: #1c1b1a; border: 1px solid #bfb5a6; }
        .ios-btn:active { transform: scale(0.97); opacity: 0.9; }
    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-content">
        <h1>Welcome</h1>
        <p>If you want to join our WhatsApp channel, click the <strong>Join WhatsApp Channel</strong> button below. If you want to view the list of all the connections we have to offer, click the <strong>View Connections</strong> button below.</p>
    </div>

    <div class="ios-btn-group">
        <a href="https://whatsapp.com/channel/0029VbDTCV73bbVB47MSzT03" target="_blank" class="ios-btn">Join WhatsApp Channel</a>
        <a href="connections.html" class="ios-btn ios-btn-secondary">View Connections</a>
    </div>
</div>

</body>
</html>
