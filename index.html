<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Portal</title>
    <style>
        :root {
            --bg-deep: #070d1b;
            --bg-card: #0f1c3f;
            --accent-blue: #3b82f6;
            --success: #25d366; /* WhatsApp Green */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); touch-action: manipulation; }
        html, body { height: 100vh; height: 100dvh; background: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; }

        .app-container { width: 100%; max-width: 480px; height: 100%; height: 100dvh; background: var(--bg-deep); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px; text-align: center; }
        @media (min-width: 500px) { .app-container { height: 90vh; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); } }

        .card { width: 100%; background: var(--bg-card); border: 1px solid #2563eb44; border-radius: 20px; padding: 32px 24px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .portal-icon { font-size: 48px; margin-bottom: 16px; display: block; }
        h1 { font-size: 22px; margin-bottom: 8px; color: #ffffff; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        .btn { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: transform 0.1s; }
        .btn-whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <span class="portal-icon">🔗</span>
        <h1>Welcome Portal</h1>
        <p>Choose an option below to join our community or explore available connections.</p>
        
        <div class="btn-group">
            <!-- Button 1: Join WhatsApp Channel -->
            <a href="https://whatsapp.com/channel/0029VbDTCV73bbVB47MSzT03" target="_blank" class="btn btn-whatsapp">Join Channel</a>
            
            <!-- Button 2: View All Connections -->
            <a href="connections.html" class="btn">View all the connections we can offer</a>
        </div>
    </div>
</div>

</body>
</html>
