<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Access Portal</title>
    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: #121212;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); touch-action: manipulation; }
        html, body { height: 100vh; height: 100dvh; background: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; top: 0; left: 0; }

        .app-container { width: 100%; max-width: 480px; height: 100%; height: 100dvh; background: var(--bg-deep); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; text-align: center; overflow: hidden; }
        @media (min-width: 500px) { .app-container { height: 90vh; border-radius: 16px; border: 1px solid #333333; box-shadow: 0 15px 40px rgba(0,0,0,0.9); } }

        .card { width: 100%; background: var(--bg-card); border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 16px; padding: 24px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; }
        .portal-icon { font-size: 36px; margin-bottom: 12px; display: block; filter: drop-shadow(0 2px 6px rgba(212, 175, 55, 0.4)); }
        h1 { font-size: 20px; margin-bottom: 8px; color: var(--gold-light); font-weight: 700; letter-spacing: 0.5px; }
        p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; background: linear-gradient(135deg, #d4af37, #aa820a); color: #050505; border: none; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 15px var(--gold-glow); transition: transform 0.1s; }
        .btn-whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); color: #ffffff; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <span class="portal-icon">👑</span>
        <h1>VIP Access Portal</h1>
        <p>Select an option below to connect with our official channel or explore available private listings.</p>
        
        <div class="btn-group">
            <a href="https://whatsapp.com/channel/0029VbDTCV73bbVB47MSzT03" target="_blank" class="btn btn-whatsapp">Join Channel</a>
            <a href="connections.html" class="btn">View all the connections we can offer</a>
        </div>
    </div>
</div>

</body>
</html>
