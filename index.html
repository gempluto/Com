<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
        html, body { height: 100vh; height: 100dvh; background: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; top: 0; left: 0; }

        .ios-container { width: 100%; max-width: 428px; height: 100vh; height: 100dvh; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px 24px; overflow: hidden; }
        @media (min-width: 500px) { .ios-container { height: 884px; border-radius: 48px; border: 12px solid #1c1c1e; box-shadow: 0 25px 60px rgba(0,0,0,0.9); } }

        .ios-content { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; width: 100%; max-width: 340px; }
        
        /* Clean instruction layout without heading or icon */
        .instruction-text { font-size: 15.5px; color: #ffffff; line-height: 1.5; font-weight: 500; }
        .instruction-text .line-two { color: #8e8e93; font-size: 14.5px; margin-top: 4px; display: block; }
        
        .arrow-indicator { font-size: 24px; margin: 4px 0; animation: bounce 1.5s infinite; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(6px); }
            60% { transform: translateY(3px); }
        }

        .ios-btn-group { width: 100%; margin-top: 8px; }
        
        /* Highly prominent, clearly clickable button */
        .ios-btn { width: 100%; background: #1c1c1e; color: #ffffff; border: 1.5px solid rgba(255, 255, 255, 0.4); padding: 18px; border-radius: 14px; font-size: 16.5px; font-weight: 700; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
        .ios-btn:active { transform: scale(0.97); background: #2c2c2e; }
    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-content">
        <div class="instruction-text">
            Click on the <strong>View All Connections</strong> button below
            <span class="line-two">to see all the connections we have to offer.</span>
        </div>

        <div class="arrow-indicator">👇</div>
        
        <div class="ios-btn-group">
            <a href="connections.html" class="ios-btn">View All Connections</a>
        </div>
    </div>
</div>

</body>
</html>
