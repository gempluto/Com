<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
        html, body { height: 100vh; height: 100dvh; background: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; top: 0; left: 0; }

        .ios-container { width: 100%; max-width: 428px; height: 100vh; height: 100dvh; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px 24px; overflow: hidden; }
        @media (min-width: 500px) { .ios-container { height: 884px; border-radius: 48px; border: 12px solid #1c1c1e; box-shadow: 0 25px 60px rgba(0,0,0,0.9); } }

        .ios-content { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; width: 100%; max-width: 340px; }
        
        .ios-icon-badge { width: 80px; height: 80px; background: #1c1c1e; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 4px; border: 0.5px solid rgba(255, 255, 255, 0.15); }
        
        h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #ffffff; }
        p { font-size: 14.5px; color: #d1d1d6; line-height: 1.45; font-weight: 500; }

        .ios-btn-group { width: 100%; margin-top: 24px; }
        
        /* Prominent, highly clickable button centered on screen */
        .ios-btn { width: 100%; background: #1c1c1e; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .ios-btn:active { transform: scale(0.97); background: #2c2c2e; }
    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-content">
        <div class="ios-icon-badge">✨</div>
        <h1>Welcome Portal</h1>
        <p>Click on the button below that says (View All Connections) to see the list for all the connections we can offer you.</p>
        
        <div class="ios-btn-group">
            <a href="connections.html" class="ios-btn">View All Connections</a>
        </div>
    </div>
</div>

</body>
</html>
